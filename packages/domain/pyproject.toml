[project]
name = "takegraph-domain"
version = "0.1.0"
description = "TAKEGRAPH domain: graph compiler, fingerprints, impact, state machines. No web/provider imports."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["takegraph_domain"]
