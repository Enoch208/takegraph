[project]
name = "takegraph-infrastructure"
version = "0.1.0"
description = "Shared TAKEGRAPH storage and media infrastructure adapters"
requires-python = ">=3.12,<3.13"
dependencies = [
    "takegraph-domain",
    "genblaze-s3>=0.3.6,<0.4",
    "pillow>=11.3,<12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["takegraph_infrastructure"]

[tool.uv.sources]
takegraph-domain = { workspace = true }
