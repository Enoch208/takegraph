# Local development dependencies. Production uses managed Postgres and Redis
# (PRD §24.3); this file exists so `make dev` works from a clean clone.
name: takegraph

services:
  postgres:
    # §6.1 requires PostgreSQL 16+. Pinned by minor so migrations are tested
    # against a known server version.
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: takegraph
      POSTGRES_PASSWORD: takegraph_local
      POSTGRES_DB: takegraph
    ports: ["5434:5432"]
    volumes: ["takegraph_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takegraph -d takegraph"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    # §6.3: Redis accelerates realtime delivery. Losing it must not corrupt a
    # build, so no persistence is configured here on purpose.
    image: redis:7.4-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  takegraph_pgdata:
