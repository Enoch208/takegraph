[project]
name = "takegraph-worker"
version = "0.1.0"
description = "TAKEGRAPH worker: durable queue, Genblaze execution, B2 storage, validation, composition"
requires-python = ">=3.12,<3.13"
dependencies = [
    "takegraph-domain",
    "takegraph-infrastructure",
    "takegraph-api",
    "genblaze-core>=0.3.8,<0.4",
    "genblaze-s3>=0.3.6,<0.4",
    "genblaze-gmicloud>=0.3.5,<0.4",
    "boto3>=1.35,<2",
    "anthropic>=0.120.2,<0.121",
    "genblaze-elevenlabs>=0.3.3,<0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["takegraph_worker"]

[tool.uv.sources]
takegraph-domain = { workspace = true }
takegraph-infrastructure = { workspace = true }
takegraph-api = { workspace = true }
