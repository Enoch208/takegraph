[project]
name = "takegraph-api"
version = "0.1.0"
description = "TAKEGRAPH FastAPI control plane"
requires-python = ">=3.12,<3.13"
dependencies = [
    "takegraph-domain",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["takegraph_api"]

[tool.uv.sources]
takegraph-domain = { workspace = true }
